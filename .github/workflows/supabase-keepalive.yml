name: Supabase Keepalive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC — safely under Supabase's 7-day inactivity limit
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_3dYmhynyHyBzagLFRmR0GQ_QnQ49FiO" \
            "https://wyzlvhjdghoiqrymkues.supabase.co/rest/v1/")
          echo "Supabase REST responded with HTTP $STATUS"

      - name: Ping Supabase Storage (vehicles bucket)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wyzlvhjdghoiqrymkues.supabase.co/storage/v1/object/public/vehicles/")
          echo "Supabase Storage responded with HTTP $STATUS"

